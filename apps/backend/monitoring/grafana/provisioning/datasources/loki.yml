apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: Request ID
          matcherRegex: '"requestId":"([^"]+)"'
          url: '/log/explore?left={"datasource":"loki","queries":[{"expr":"{service=\\"backend\\"} |= \\"$${__value.raw}\\""}]}'
